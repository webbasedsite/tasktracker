<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Task Tracker | Employee Dashboard</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">


<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">


<link rel="stylesheet" href="css_dashboard.css">


</head>


<body>



<!-- Navbar -->

<nav class="navbar navbar-expand-lg bg-white shadow-sm">

<div class="container-fluid">


<h4 class="m-0 fw-bold">

<i class="fa-solid fa-list-check text-primary"></i>

Task Tracker

</h4>




<div>


<span class="me-3">

<i class="fa-solid fa-user"></i>

<span id="employeeName"></span>

</span>



<button 
class="btn btn-outline-danger btn-sm"
id="logoutBtn">

<i class="fa-solid fa-right-from-bracket"></i>

Logout

</button>


</div>


</div>

</nav>






<div class="container py-4">





<!-- Summary Cards -->


<div class="row g-3">


<div class="col-md-4">

<div class="card summary-card">

<div class="card-body">

<h6>Total Task</h6>

<h2 id="totalTask">0</h2>

</div>

</div>

</div>




<div class="col-md-4">

<div class="card summary-card success">

<div class="card-body">

<h6>Completed</h6>

<h2 id="completedTask">0</h2>

</div>

</div>

</div>




<div class="col-md-4">

<div class="card summary-card warning">

<div class="card-body">

<h6>Pending</h6>

<h2 id="pendingTask">0</h2>

</div>

</div>

</div>



</div>








<!-- Progress -->


<div class="card mt-4">


<div class="card-body">


<div class="d-flex justify-content-between">


<h5>
Today's Progress
</h5>


<span id="progressText">
0%
</span>


</div>



<div class="progress mt-3" style="height:10px;">


<div

id="progressBar"

class="progress-bar bg-success"

style="width:0%;">

</div>


</div>



</div>


</div>








<!-- Task Table -->


<div class="card mt-4">



<div class="card-header d-flex justify-content-between align-items-center">


<h5 class="mb-0">

Today's Tasks

</h5>




<!-- Employee Own Add Task -->

<button

class="btn btn-primary btn-sm"

data-bs-toggle="modal"

data-bs-target="#addTaskModal">


<i class="fa-solid fa-plus"></i>

Add Task


</button>



</div>





<div class="table-responsive">


<table class="table table-hover align-middle">


<thead>


<tr>

<th>#</th>

<th>Task</th>

<th>Time</th>

<th>Status</th>

<th>Action</th>


</tr>


</thead>



<tbody id="taskTable">


</tbody>



</table>


</div>


</div>






</div>









<!-- ==============================
     ADD TASK MODAL
=============================== -->


<div class="modal fade" id="addTaskModal">


<div class="modal-dialog">


<div class="modal-content">



<div class="modal-header">


<h5 class="modal-title">

Add Your Task

</h5>



<button 
class="btn-close"
data-bs-dismiss="modal">

</button>


</div>







<div class="modal-body">



<div class="mb-3">


<label class="form-label">

Task Name

</label>


<input

type="text"

id="newTaskName"

class="form-control"

placeholder="Enter Task Name">


</div>






<div class="mb-3">


<label class="form-label">

Task Type

</label>


<select

id="newTaskType"

class="form-select">


<option value="Daily">

Daily

</option>


<option value="Weekly">

Weekly

</option>


</select>


</div>







<div class="mb-3">


<label class="form-label">

Start Time

</label>


<input

type="time"

id="newTaskStart"

class="form-control">


</div>






<div class="mb-3">


<label class="form-label">

Duration (Minutes)

</label>


<input

type="number"

id="newTaskDuration"

class="form-control"

value="30">


</div>





</div>








<div class="modal-footer">



<button

class="btn btn-secondary"

data-bs-dismiss="modal">

Close

</button>





<button

class="btn btn-primary"

onclick="addTask()">

Save Task

</button>



</div>




</div>


</div>


</div>









<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


<script src="config.js"></script>

<script src="js_employee.js"></script>



</body>

</html>
