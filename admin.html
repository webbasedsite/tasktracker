<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Task Tracker | Admin Dashboard</title>


<!-- Bootstrap -->

<link 
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">


<!-- Font Awesome -->

<link 
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">


<!-- Google Font -->

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">


<!-- Dashboard CSS -->

<link rel="stylesheet" href="css/admin.css">


</head>


<body>


<!-- Top Navbar -->

<nav class="navbar bg-white shadow-sm">

<div class="container-fluid">


<h4 class="fw-bold">

<i class="fa-solid fa-chart-line text-primary"></i>

Task Tracker Admin

</h4>


<div>


<span class="me-3">

<i class="fa-solid fa-user-shield"></i>

Admin

</span>


<button 
id="adminLogout"
class="btn btn-outline-danger btn-sm">


<i class="fa-solid fa-right-from-bracket"></i>

Logout


</button>


</div>


</div>

</nav>





<div class="container py-4">


<!-- Summary Cards -->


<div class="row g-3">



<div class="col-md-3">


<div class="card admin-card blue">


<div class="card-body">


<h6>Total Employee</h6>


<h2 id="totalEmployee">
0
</h2>


</div>

</div>


</div>




<div class="col-md-3">


<div class="card admin-card green">


<div class="card-body">


<h6>Total Task</h6>


<h2 id="totalAdminTask">
0
</h2>


</div>

</div>


</div>





<div class="col-md-3">


<div class="card admin-card orange">


<div class="card-body">


<h6>Completed</h6>


<h2 id="adminCompleted">
0
</h2>


</div>

</div>


</div>





<div class="col-md-3">


<div class="card admin-card red">


<div class="card-body">


<h6>Pending</h6>


<h2 id="adminPending">
0
</h2>


</div>

</div>


</div>



</div>





<!-- Hub Summary -->


<div class="card mt-4">


<div class="card-header">

<h5 class="mb-0">

<i class="fa-solid fa-building"></i>

Hub Summary

</h5>

</div>



<div class="table-responsive">


<table class="table">


<thead>


<tr>

<th>Hub</th>

<th>Total</th>

<th>Completed</th>

<th>Pending</th>

<th>Late</th>


</tr>


</thead>



<tbody id="hubTable">


</tbody>



</table>


</div>


</div>








<!-- Employee Performance -->


<div class="card mt-4">


<div class="card-header">


<h5 class="mb-0">

<i class="fa-solid fa-users"></i>

Employee Performance

</h5>


</div>



<div class="table-responsive">


<table class="table">


<thead>


<tr>

<th>Employee</th>

<th>Assigned</th>

<th>Completed</th>

<th>Pending</th>

<th>Score</th>


</tr>


</thead>



<tbody id="employeeTable">


</tbody>



</table>


</div>


</div>







<!-- Activity -->


<div class="card mt-4">


<div class="card-header">


<h5 class="mb-0">

<i class="fa-solid fa-clock-rotate-left"></i>

Recent Activity

</h5>


</div>



<ul 
class="list-group list-group-flush"
id="activityList">


</ul>


</div>





</div>




<script src="config.js"></script>
<script src="admin.js"></script>



</body>

</html>
