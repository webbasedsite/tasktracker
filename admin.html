<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Task Tracker | Admin Dashboard
</title>


<link 
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">


<link 
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">


<link 
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">


<link rel="stylesheet" href="css_admin.css">


</head>



<body>



<!-- =========================
NAVBAR
========================= -->


<nav class="navbar bg-white shadow-sm">


<div class="container-fluid">


<h4 class="fw-bold">


<i class="fa-solid fa-chart-line text-primary"></i>

Task Tracker Admin


</h4>




<div>


<span class="me-3">


<i class="fa-solid fa-user-shield"></i>

<span id="adminName">
Admin
</span>


</span>




<button 
id="adminLogout"
class="btn btn-outline-danger btn-sm">


<i class="fa-solid fa-right-from-bracket"></i>

Logout


</button>



</div>



</div>


</nav>







<div class="container py-4">





<!-- =========================
CREATE TASK BUTTON
========================= -->


<div class="text-end mb-3">


<button

class="btn btn-primary"

data-bs-toggle="modal"

data-bs-target="#adminTaskModal">


<i class="fa fa-plus"></i>

Create Task


</button>


</div>








<!-- =========================
SUMMARY CARDS
========================= -->


<div class="row g-3">



<div class="col-md-3">

<div class="card admin-card blue">

<div class="card-body">


<h6>
Total Task
</h6>


<h2 id="totalAdminTask">
0
</h2>


</div>

</div>

</div>






<div class="col-md-3">


<div class="card admin-card green">


<div class="card-body">


<h6>
Completed
</h6>


<h2 id="adminCompleted">
0
</h2>


</div>


</div>


</div>






<div class="col-md-3">


<div class="card admin-card orange">


<div class="card-body">


<h6>
Running
</h6>


<h2 id="adminRunning">
0
</h2>


</div>


</div>


</div>







<div class="col-md-3">


<div class="card admin-card red">


<div class="card-body">


<h6>
Pending
</h6>


<h2 id="adminPending">
0
</h2>


</div>


</div>


</div>




</div>










<!-- =========================
HUB SUMMARY
========================= -->


<div class="card mt-4">


<div class="card-header">


<h5>


<i class="fa-solid fa-building"></i>

Hub Summary


</h5>


</div>





<div class="table-responsive">


<table class="table">


<thead>


<tr>

<th>
Hub
</th>

<th>
Total
</th>

<th>
Completed
</th>

<th>
Pending
</th>

<th>
Progress
</th>


</tr>


</thead>



<tbody id="hubTable">


</tbody>


</table>


</div>


</div>









<!-- =========================
EMPLOYEE PERFORMANCE
========================= -->


<div class="card mt-4">


<div class="card-header">


<h5>


<i class="fa-solid fa-users"></i>

Employee Performance


</h5>


</div>





<div class="table-responsive">


<table class="table">


<thead>


<tr>

<th>
Employee
</th>

<th>
Hub
</th>

<th>
Assigned
</th>

<th>
Completed
</th>

<th>
Score
</th>


</tr>


</thead>



<tbody id="employeeTable">


</tbody>


</table>


</div>


</div>









<!-- =========================
ALL TASK LIST
========================= -->


<div class="card mt-4">


<div class="card-header">


<h5>


<i class="fa-solid fa-list-check"></i>

All Tasks


</h5>


</div>





<div class="table-responsive">


<table class="table table-hover">


<thead>


<tr>


<th>
#
</th>


<th>
Employee
</th>


<th>
Task
</th>


<th>
Hub
</th>


<th>
Status
</th>


<th>
Action
</th>


</tr>


</thead>



<tbody id="adminTaskTable">


</tbody>


</table>


</div>


</div>










<!-- =========================
ACTIVITY LOG
========================= -->


<div class="card mt-4">


<div class="card-header">


<h5>


<i class="fa-solid fa-clock-rotate-left"></i>

Recent Activity


</h5>


</div>



<ul

class="list-group list-group-flush"

id="activityList">


</ul>



</div>





</div>









<!-- =========================
ADMIN CREATE TASK MODAL
========================= -->


<div 
class="modal fade"
id="adminTaskModal">


<div class="modal-dialog">


<div class="modal-content">



<div class="modal-header">


<h5 class="modal-title">

Create Task

</h5>


<button

class="btn-close"

data-bs-dismiss="modal">

</button>


</div>







<div class="modal-body">





<label>
Task Name
</label>


<input

id="adminTaskName"

class="form-control mb-3"

placeholder="Enter Task">




<label>
Task Type
</label>


<select

id="adminTaskType"

class="form-select mb-3">


<option value="Daily">
Daily
</option>


<option value="Weekly">
Weekly
</option>


<option value="Monthly">
Monthly
</option>


</select>







<label>
Assign Hub
</label>


<select

id="adminHub"

class="form-select mb-3">


<option value="ALL">
ALL HUB
</option>


</select>







<label>
Start Time
</label>


<input

type="time"

id="adminStart"

class="form-control mb-3">






<label>
Duration
</label>


<input

type="number"

id="adminDuration"

class="form-control"

value="30">


</div>








<div class="modal-footer">


<button

class="btn btn-secondary"

data-bs-dismiss="modal">


Close


</button>





<button

class="btn btn-primary"

onclick="createAdminTask()">


Create Task


</button>



</div>





</div>


</div>


</div>










<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


<script src="config.js"></script>


<script src="js_admin.js"></script>



</body>


</html>
